name: Release to npm

# Publishes @vikranth2005/vtop-mcp to npm when a tag matching `v*` is pushed.
#
# WHY CI AND NOT `npm publish` FROM A LAPTOP:
# Windows cannot write the POSIX executable bit into the npm tarball, so a
# bin published from Windows comes out mode 0644 and `npx` fails on other
# Windows machines with "'<bin>' is not recognized". This Linux runner sets
# the bit (chmod +x) and packs it correctly.
#
# Release flow:
#   1. npm version patch          (bumps package.json, commits, tags vX.Y.Z)
#   2. git push --follow-tags     (pushes the tag)
#   3. this workflow              builds, chmods, smoke-tests, publishes
#
# Auth: add a repo secret NPM_TOKEN (npmjs.com → Access Tokens →
# Generate New Token → "Automation"). That's the only setup required.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      # Belt-and-suspenders: guarantee the bin is executable in the tarball.
      - run: chmod +x dist/index.js

      - run: npm run test:mcp

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
