name: Release to npm

# Publishes vtop-mcp to npm whenever a git tag matching `v*` is pushed.
# Uses Trusted Publishing (OIDC) — no NPM_TOKEN needed. You must first
# configure the trusted publisher on npmjs.com pointing at this workflow.
#
# Release flow:
#   1. Bump version:     npm version patch     (creates a v1.0.1 tag locally)
#   2. Push tag:         git push --follow-tags
#   3. This workflow:    builds, smoke-tests, publishes with provenance.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm OIDC / provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - run: npm run test:mcp

      - run: npm publish --provenance --access public
